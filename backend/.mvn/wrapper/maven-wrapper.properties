# ============================================================
# Configuration du wrapper Maven (mvnw) — contrainte B1 du sujet :
# le wrapper doit être commité pour que le formateur n'installe pas Maven.
#
# distributionUrl : Maven 3.9.9, archive officielle Apache (URL stable).
# wrapperUrl      : jar du wrapper Maven 3.3.2.
# ============================================================
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
