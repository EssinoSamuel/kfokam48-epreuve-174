# ============================================================
# Profil « test » — autonome, sans Docker ni PostgreSQL local.
#
# Objectif (contrainte B6) : `mvnw test` doit passer sur un poste vierge.
# H2 en mémoire + Flyway réellement exécuté : les migrations sont donc
# testées, pas contournées. Le script H2 rend le SQL PostgreSQL compatible.
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:kfokam48;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # H2 repositionne lui-même ses colonnes IDENTITY après un INSERT
      # avec identifiant explicite : aucun setval n'est nécessaire.
      avancer_sequences: "-- sequences gerees automatiquement par H2"
      # H2 n'accepte pas les index partiels (WHERE) : l'unicité de ce cas
      # est alors portée par le code applicatif uniquement en test.
      index_uniq_tentative_sans_session: "-- H2 n'accepte pas les index partiels"

server:
  port: 0
